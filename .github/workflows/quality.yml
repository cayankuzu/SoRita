name: Quality

on:
  push:
    branches: [main, chore/aaa-mvp-feature-freeze-cloudflare-ota]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  NODE_OPTIONS: --max-old-space-size=6144
  NODE_VERSION: '24'
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  repository-gates:
    name: Repository release gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the immutable workflow SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install the root lockfile without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run Expo, feature-freeze, static, test, supply-chain and coverage gates
        run: npm run check:release

      - name: Install the isolated Worker lockfile without lifecycle scripts
        working-directory: infra/cloudflare/sorita-edge
        run: npm ci --ignore-scripts

      - name: Run Worker types, lint, tests and dependency audit
        working-directory: infra/cloudflare/sorita-edge
        run: |
          npm run check
          npm audit --audit-level=high

      - name: Prove the gates did not rewrite tracked files
        run: git diff --exit-code

  semgrep:
    name: Semgrep CE SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.172.0
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Scan TypeScript and React Native sources
        run: >-
          semgrep scan
          --config p/typescript
          --config p/react
          --error
          --metrics=off
          --exclude node_modules
          --exclude android
          --exclude coverage
          --exclude artifacts
          src supabase/functions infra/cloudflare/sorita-edge/src

  full-history-secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan every reachable commit with a digest-pinned Gitleaks image
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.29.0@sha256:507de9682470025fb3e7f57fe4c4ca8263d81369e027b6538b8a252a9c0371d4
          git --redact --log-opts="--all" /repo
