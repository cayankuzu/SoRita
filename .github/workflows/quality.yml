name: Quality

on:
  push:
    branches:
      - main
      - chore/final-aaa-mvp-hardening-docker-cloudflare-ota
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  NODE_OPTIONS: --max-old-space-size=6144
  NODE_VERSION: '24'
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  repository-gates:
    name: Repository release gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the immutable workflow SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install the root lockfile without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run Expo, feature-freeze, static, test, supply-chain and coverage gates
        run: npm run check:release

      - name: Install the isolated Worker lockfile without lifecycle scripts
        working-directory: infra/cloudflare/sorita-edge
        run: npm ci --ignore-scripts

      - name: Run Worker types, lint, tests and dependency audit
        working-directory: infra/cloudflare/sorita-edge
        shell: bash
        run: |
          set -euo pipefail
          npm run check

          # `npm audit` exits non-zero both for a real advisory and for an
          # unreachable registry. Only the second is worth retrying, so the
          # output decides: a genuine finding fails immediately, a registry
          # problem is retried, and exhausting the retries still fails closed.
          for attempt in 1 2 3; do
            if output="$(npm audit --audit-level=high 2>&1)"; then
              printf '%s\n' "$output"
              exit 0
            fi
            printf '%s\n' "$output"
            if ! printf '%s' "$output" | grep -qiE 'audit endpoint returned an error|network timeout|ENOTFOUND|ECONNRESET|EAI_AGAIN|ETIMEDOUT'; then
              echo "::error::npm audit reported a dependency advisory."
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Registry advisory API unreachable; retrying in $((attempt * 10))s."
              sleep "$((attempt * 10))"
            fi
          done
          echo "::error::npm audit could not reach the registry advisory API after 3 attempts."
          exit 1

      - name: Prove the gates did not rewrite tracked files
        run: git diff --exit-code

  semgrep:
    name: Semgrep CE SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.172.0
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Scan TypeScript and React Native sources
        run: >-
          semgrep scan
          --config p/typescript
          --config p/react
          --error
          --metrics=off
          --exclude node_modules
          --exclude android
          --exclude coverage
          --exclude artifacts
          src supabase/functions infra/cloudflare/sorita-edge/src

  full-history-secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan every reachable commit with a digest-pinned Gitleaks image
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.29.0@sha256:507de9682470025fb3e7f57fe4c4ca8263d81369e027b6538b8a252a9c0371d4
          git --redact --gitleaks-ignore-path=/repo/.gitleaksignore --log-opts="--all" /repo
