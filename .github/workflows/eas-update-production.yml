name: EAS Update Production
run-name: Production OTA for ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full source SHA of the installed OTA-enabled binary for this runtime
        required: true
        type: string
      preview_run_id:
        description: Successful EAS Update Preview workflow run ID for this exact commit
        required: true
        type: string
      quality_run_id:
        description: Successful Quality workflow run ID for this exact commit
        required: true
        type: string
      database_run_id:
        description: Successful Database Validation workflow run ID for this exact commit
        required: true
        type: string
      release_evidence_run_id:
        description: Successful Release Evidence workflow run ID for this exact commit
        required: true
        type: string
      ota_binary_evidence:
        description: "Store builds: android=<id>;ios=<id>;runtime=<version>;source=<base_sha>"
        required: true
        type: string
      message:
        description: Short release note (single line, at most 200 characters)
        required: true
        type: string
      confirm_production:
        description: Publish this verified commit to 5% of the production channel
        required: true
        default: false
        type: boolean

# Configure required reviewers on the GitHub environment named "production".
permissions:
  actions: read
  contents: read

concurrency:
  group: eas-update-production
  cancel-in-progress: false

jobs:
  publish-production:
    name: Verify and publish 5% production OTA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_RELEASE_ENVIRONMENT: production
      EXPO_PUBLIC_EXPO_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EXPO_PROJECT_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NODE_OPTIONS: --max-old-space-size=6144
      NODE_VERSION: "24"

    steps:
      - name: Check out the exact workflow SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up pinned EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0
        with:
          eas-version: 23.0.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify source, approval, and OTA-enabled store binaries
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OTA_BINARY_EVIDENCE: ${{ inputs.ota_binary_evidence }}
          TARGET_SHA: ${{ github.sha }}
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail

          sha_pattern='^[0-9a-fA-F]{40}$'
          evidence_pattern='^android=[A-Za-z0-9._-]+;ios=[A-Za-z0-9._-]+;runtime=[0-9]+\.[0-9]+\.[0-9]+;source=[0-9a-fA-F]{40}$'
          runtime_version="$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")"

          if [[ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo '::error::Production OTA must be dispatched from the repository default branch.'
            exit 1
          fi
          if [[ "$CONFIRM_PRODUCTION" != 'true' ]]; then
            echo '::error::Explicit production confirmation is required.'
            exit 1
          fi
          if [[ ! "$BASE_SHA" =~ $sha_pattern ]] || [[ ! "$TARGET_SHA" =~ $sha_pattern ]]; then
            echo '::error::base_sha and target SHA must be full 40-character commit SHAs.'
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$TARGET_SHA" ]]; then
            echo '::error::The checked-out commit does not match github.sha.'
            exit 1
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" "$TARGET_SHA"

          if [[ -z "$EXPO_PUBLIC_EXPO_PROJECT_ID" ]]; then
            echo '::error::The production GitHub environment must define EXPO_PUBLIC_EXPO_PROJECT_ID.'
            exit 1
          fi
          if [[ ! "$OTA_BINARY_EVIDENCE" =~ $evidence_pattern ]] || [[ "$OTA_BINARY_EVIDENCE" != *";runtime=${runtime_version};source=${BASE_SHA}" ]]; then
            echo '::error::Evidence must bind OTA-enabled Android and iOS store builds to this runtime and binary source SHA.'
            exit 1
          fi
          if [[ "$UPDATE_MESSAGE" == *$'\n'* ]] || (( ${#UPDATE_MESSAGE} > 200 )); then
            echo '::error::The release note must be one line and no longer than 200 characters.'
            exit 1
          fi

          if [[ "$OTA_BINARY_EVIDENCE" =~ ^android=([^;]+)\;ios=([^;]+)\;runtime=([^;]+)\;source=([^;]+)$ ]]; then
            android_build_id="${BASH_REMATCH[1]}"
            ios_build_id="${BASH_REMATCH[2]}"
          else
            echo '::error::Unable to parse OTA binary evidence.'
            exit 1
          fi
          mkdir -p artifacts/eas-update-production
          eas build:view "$android_build_id" --json > "${RUNNER_TEMP}/eas-production-android-build.json"
          eas build:view "$ios_build_id" --json > "${RUNNER_TEMP}/eas-production-ios-build.json"
          node utils/eas/verify-build-evidence.mjs \
            --android-json "${RUNNER_TEMP}/eas-production-android-build.json" \
            --app-identifier com.cayan.sorita.socialmap \
            --evidence "$OTA_BINARY_EVIDENCE" \
            --ios-json "${RUNNER_TEMP}/eas-production-ios-build.json" \
            --output artifacts/eas-update-production/builds.json \
            --profile production \
            --project-id "$EXPO_PUBLIC_EXPO_PROJECT_ID" \
            --runtime "$runtime_version" \
            --source "$BASE_SHA"

      - name: Verify successful preview and CI gates for the same SHA
        shell: bash
        env:
          DATABASE_RUN_ID: ${{ inputs.database_run_id }}
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
          QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          verify_run() {
            local run_id="$1"
            local workflow_file="$2"
            local required_event="${3:-}"
            if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
              echo "::error::${workflow_file} run ID must be numeric."
              exit 1
            fi
            local run_fields expected_workflow_id
            run_fields="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '[.status,.conclusion,.head_sha,.event,(.workflow_id|tostring),.head_repository.full_name] | @tsv')"
            expected_workflow_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}" --jq '.id')"
            local run_status conclusion evidence_sha event_name workflow_id head_repository
            IFS=$'\t' read -r run_status conclusion evidence_sha event_name workflow_id head_repository <<< "$run_fields"
            if [[ "$run_status" != completed || "$conclusion" != success || "$evidence_sha" != "$TARGET_SHA" || "$workflow_id" != "$expected_workflow_id" || "$head_repository" != "$GITHUB_REPOSITORY" ]]; then
              echo "::error::${workflow_file} is not successful same-SHA evidence."
              exit 1
            fi
            if [[ -n "$required_event" && "$event_name" != "$required_event" ]]; then
              echo "::error::${workflow_file} must come from ${required_event}."
              exit 1
            fi
          }

          verify_run "$PREVIEW_RUN_ID" eas-update-preview.yml workflow_dispatch
          verify_run "$QUALITY_RUN_ID" quality.yml
          verify_run "$DATABASE_RUN_ID" database-validation.yml

      - name: Download and verify the exact release evidence packet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVIDENCE_RUN_ID: ${{ inputs.release_evidence_run_id }}
          RELEASE_MANIFEST: ${{ github.workspace }}/artifacts/release-evidence/manifest.json
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo '::error::release_evidence_run_id must be numeric.'
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$TARGET_SHA" ]]; then
            echo '::error::Release evidence must be verified from the exact deployment commit.'
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo '::error::Release evidence verification requires a clean checkout.'
            exit 1
          fi

          run_fields="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_EVIDENCE_RUN_ID}" --jq '[.status,.conclusion,.head_sha,.event,(.workflow_id|tostring),.head_repository.full_name,.repository.full_name] | @tsv')"
          expected_workflow_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/release-evidence.yml" --jq '.id')"
          IFS=$'\t' read -r run_status conclusion evidence_sha event_name workflow_id head_repository repository <<< "$run_fields"
          if [[ "$run_status" != completed || "$conclusion" != success || "${evidence_sha,,}" != "${TARGET_SHA,,}" || "$event_name" != workflow_dispatch || "$workflow_id" != "$expected_workflow_id" || "$head_repository" != "$GITHUB_REPOSITORY" || "$repository" != "$GITHUB_REPOSITORY" ]]; then
            echo '::error::Release Evidence run must be a successful same-repository workflow_dispatch for the exact deployment SHA.'
            exit 1
          fi

          artifact_name="final-release-evidence-${TARGET_SHA}"
          artifact_rows="${RUNNER_TEMP}/release-evidence-artifacts.jsonl"
          artifact_selection="${RUNNER_TEMP}/release-evidence-artifact.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_EVIDENCE_RUN_ID}/artifacts?per_page=100" \
            --paginate \
            --jq '.artifacts[] | @json' \
            > "$artifact_rows"
          ARTIFACT_NAME="$artifact_name" ARTIFACT_ROWS="$artifact_rows" \
            ARTIFACT_SELECTION="$artifact_selection" node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const rows = readFileSync(process.env.ARTIFACT_ROWS, 'utf8')
            .split(/\r?\n/u)
            .filter(Boolean)
            .map((row) => JSON.parse(row));
          const matches = rows.filter((artifact) => artifact.name === process.env.ARTIFACT_NAME);
          if (matches.length !== 1) {
            throw new Error(`Expected exactly one ${process.env.ARTIFACT_NAME} artifact; found ${matches.length}.`);
          }
          const [artifact] = matches;
          if (artifact.expired === true) throw new Error('The selected release evidence artifact has expired.');
          if (artifact.workflow_run?.id !== Number(process.env.RELEASE_EVIDENCE_RUN_ID)) {
            throw new Error('Release evidence artifact is not bound to the selected workflow run.');
          }
          if (artifact.workflow_run?.head_sha?.toLowerCase() !== process.env.TARGET_SHA.toLowerCase()) {
            throw new Error('Release evidence artifact SHA does not match the deployment SHA.');
          }
          if (!/^sha256:[a-f0-9]{64}$/u.test(artifact.digest ?? '')) {
            throw new Error('Release evidence artifact is missing its GitHub SHA-256 digest.');
          }
          writeFileSync(
            process.env.ARTIFACT_SELECTION,
            `${JSON.stringify({ id: artifact.id, digest: artifact.digest }, null, 2)}\n`,
          );
          NODE

          mkdir -p artifacts/release-evidence
          IFS=$'\t' read -r artifact_id expected_digest < <(
            node -e "const a=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')); process.stdout.write(a.id+'\\t'+a.digest+'\\n')" \
              "$artifact_selection"
          )
          archive_file="${RUNNER_TEMP}/${artifact_name}.zip"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$archive_file" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"
          actual_digest="sha256:$(sha256sum "$archive_file" | awk '{print $1}')"
          if [[ "$actual_digest" != "$expected_digest" ]]; then
            echo '::error::Downloaded release evidence artifact digest does not match GitHub metadata.'
            exit 1
          fi
          unzip -q "$archive_file" -d artifacts/release-evidence
          test -f "$RELEASE_MANIFEST"
          npm run release-evidence:verify -- --manifest "$RELEASE_MANIFEST"

          EXPECTED_RUNTIME_VERSION="$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")" \
            RELEASE_MANIFEST="$RELEASE_MANIFEST" \
            TARGET_SHA="$TARGET_SHA" \
            node <<'NODE'
          const { readFileSync } = require('node:fs');
          const manifest = JSON.parse(readFileSync(process.env.RELEASE_MANIFEST, 'utf8'));
          const nonPassingChecks = Object.entries(manifest.checks ?? {})
            .filter(([, state]) => state !== 'pass')
            .map(([name, state]) => `${name}=${state}`);
          if (nonPassingChecks.length > 0) {
            throw new Error(`Release evidence contains non-passing checks: ${nonPassingChecks.join(', ')}`);
          }
          if (manifest.commitSha !== process.env.TARGET_SHA) {
            throw new Error('Release evidence commit does not match the deployment commit.');
          }
          if (manifest.repository !== `https://github.com/${process.env.GITHUB_REPOSITORY}`) {
            throw new Error('Release evidence repository does not match this repository.');
          }
          if (manifest.release?.environment !== 'production' || manifest.release?.channel !== 'production') {
            throw new Error('Release evidence must target the production environment and channel.');
          }
          if (manifest.release?.runtimeVersion !== process.env.EXPECTED_RUNTIME_VERSION) {
            throw new Error('Release evidence runtime does not match package.json.');
          }
          NODE

      - name: Classify the commit range
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          classification="$(node utils/guards/classify-ota-change.mjs --base "$BASE_SHA" --head "$TARGET_SHA")"
          if [[ "$classification" != 'OTA_SAFE' ]]; then
            node utils/guards/classify-ota-change.mjs --base "$BASE_SHA" --head "$TARGET_SHA" --explain
            echo "::error::Production OTA blocked: ${classification}."
            exit 1
          fi
          echo "classification=${classification}" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Re-run the complete release quality gate
        run: npm run check:release

      - name: Require a valid tracked OTA code-signing certificate
        shell: bash
        run: |
          set -euo pipefail
          npx expo config --json > "${RUNNER_TEMP}/expo-production-config.json"
          node utils/eas/check-update-code-signing.mjs \
            --config "${RUNNER_TEMP}/expo-production-config.json"

      - name: Publish an initial 5% production rollout
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          eas update \
            --channel production \
            --environment production \
            --message "${UPDATE_MESSAGE} [sha:${TARGET_SHA}]" \
            --platform all \
            --rollout-percentage 5 \
            --json \
            --non-interactive \
            > "${RUNNER_TEMP}/eas-production-update.json"
          echo 'EAS_ROLLOUT_STARTED=true' >> "$GITHUB_ENV"
          mkdir -p artifacts/eas-update-production
          RESULT_PATH="${RUNNER_TEMP}/eas-production-update.json" \
            SANITIZED_PATH="artifacts/eas-update-production/update.json" \
            node <<'NODE'
          const { appendFileSync, readFileSync, writeFileSync } = require('node:fs');
          const payload = JSON.parse(readFileSync(process.env.RESULT_PATH, 'utf8'));
          const updates = Array.isArray(payload) ? payload : payload.updates;
          if (!Array.isArray(updates) || updates.length === 0) throw new Error('EAS returned no production updates.');
          const groups = [...new Set(updates.map((update) => update.group ?? update.groupId).filter(Boolean))];
          if (groups.length !== 1 || !/^[A-Za-z0-9-]{8,128}$/.test(groups[0])) {
            throw new Error('EAS returned an unexpected production update group.');
          }
          const group = groups[0];
          appendFileSync(process.env.GITHUB_ENV, `EAS_PRODUCTION_UPDATE_GROUP=${group}\n`);
          const sanitizedUpdates = updates.map((update) => ({
            group,
            id: update.id ?? update.updateId ?? null,
            platform: update.platform ?? null,
            runtimeVersion: update.runtimeVersion ?? null,
          }));
          writeFileSync(
            process.env.SANITIZED_PATH,
            `${JSON.stringify({ commitSha: process.env.GITHUB_SHA, group, rolloutPercentage: 5, updates: sanitizedUpdates }, null, 2)}\n`,
          );
          NODE

      - name: Record staged-rollout and rollback instructions
        shell: bash
        env:
          RESULT_PATH: ${{ runner.temp }}/eas-production-update.json
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFileSync, readFileSync } = require('node:fs');
          const group = process.env.EAS_PRODUCTION_UPDATE_GROUP;
          if (!/^[A-Za-z0-9-]{8,128}$/.test(group ?? '')) throw new Error('Production update group is unavailable.');
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              '## Production OTA started at 5%',
              '',
              `- Commit: \`${process.env.TARGET_SHA}\``,
              `- Update group: \`${group}\``,
              '',
              'After each monitoring window, a release approver must run these commands manually in order:',
              '',
              `1. \`eas update:edit ${group} --rollout-percentage 20 --non-interactive\``,
              `2. \`eas update:edit ${group} --rollout-percentage 50 --non-interactive\``,
              `3. \`eas update:edit ${group} --rollout-percentage 100 --non-interactive\``,
              '',
              `To stop this active rollout: \`eas update:revert-update-rollout --group ${group} --non-interactive\``,
              '',
              'This workflow performs only the initial 5% publish; it does not automatically advance later stages.',
              '',
            ].join('\n'),
          );
          NODE

      - name: Automatically stop a failed or cancelled production rollout
        if: (failure() || cancelled()) && env.EAS_ROLLOUT_STARTED == 'true'
        shell: bash
        env:
          RESULT_PATH: ${{ runner.temp }}/eas-production-update.json
        run: |
          set -euo pipefail
          group="${EAS_PRODUCTION_UPDATE_GROUP:-}"
          if [[ -z "$group" && -f "$RESULT_PATH" ]]; then
            group="$(node -e "const p=JSON.parse(require('node:fs').readFileSync(process.env.RESULT_PATH,'utf8')); const u=Array.isArray(p)?p:p.updates; const g=[...new Set((u||[]).map(x=>x.group||x.groupId).filter(Boolean))]; if(g.length!==1)process.exit(2); process.stdout.write(g[0]);")"
          fi
          if [[ ! "$group" =~ ^[A-Za-z0-9-]{8,128}$ ]]; then
            echo '::error::Unable to resolve the published rollout group for automatic rollback.'
            exit 1
          fi
          eas update:revert-update-rollout --group "$group" --non-interactive \
            2>&1 | tee "${RUNNER_TEMP}/eas-production-rollback.log"

      - name: Upload sanitized OTA and rollback evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eas-production-${{ github.sha }}
          path: |
            artifacts/eas-update-production/update.json
            ${{ runner.temp }}/eas-production-rollback.log
          if-no-files-found: warn
          retention-days: 90

      - name: Remove transient update material
        if: always()
        shell: bash
        run: |
          rm -f -- "${RUNNER_TEMP}/eas-production-update.json"
          rm -rf -- "${GITHUB_WORKSPACE}/dist" "${GITHUB_WORKSPACE}/.expo"
          printf 'EXPO_TOKEN=\n' >> "$GITHUB_ENV"
