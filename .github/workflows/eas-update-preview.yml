name: EAS Update Preview
run-name: Preview OTA for ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full source SHA of the installed OTA-enabled binary for this runtime
        required: true
        type: string
      ota_binary_evidence:
        description: 'Installed builds: android=<id>;ios=<id>;runtime=<version>;source=<base_sha>'
        required: true
        type: string
      message:
        description: Short release note (single line, at most 200 characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: eas-update-preview-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish-preview:
    name: Verify and publish preview OTA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: preview
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_RELEASE_ENVIRONMENT: preview
      EXPO_PUBLIC_EXPO_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EXPO_PROJECT_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NODE_OPTIONS: --max-old-space-size=6144
      NODE_VERSION: '24'

    steps:
      - name: Check out the exact workflow SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up pinned EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0
        with:
          eas-version: 23.0.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify source and OTA-enabled preview binaries
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          OTA_BINARY_EVIDENCE: ${{ inputs.ota_binary_evidence }}
          TARGET_SHA: ${{ github.sha }}
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail

          sha_pattern='^[0-9a-fA-F]{40}$'
          evidence_pattern='^android=[A-Za-z0-9._-]+;ios=[A-Za-z0-9._-]+;runtime=[0-9]+\.[0-9]+\.[0-9]+;source=[0-9a-fA-F]{40}$'
          runtime_version="$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")"

          if [[ ! "$BASE_SHA" =~ $sha_pattern ]] || [[ ! "$TARGET_SHA" =~ $sha_pattern ]]; then
            echo '::error::base_sha and target SHA must be full 40-character commit SHAs.'
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$TARGET_SHA" ]]; then
            echo '::error::The checked-out commit does not match github.sha.'
            exit 1
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" "$TARGET_SHA"

          if [[ -z "$EXPO_PUBLIC_EXPO_PROJECT_ID" ]]; then
            echo '::error::The preview GitHub environment must define EXPO_PUBLIC_EXPO_PROJECT_ID.'
            exit 1
          fi
          if [[ ! "$OTA_BINARY_EVIDENCE" =~ $evidence_pattern ]] || [[ "$OTA_BINARY_EVIDENCE" != *";runtime=${runtime_version};source=${BASE_SHA}" ]]; then
            echo '::error::Evidence must bind OTA-enabled Android and iOS builds to this runtime and binary source SHA.'
            exit 1
          fi
          if [[ "$UPDATE_MESSAGE" == *$'\n'* ]] || (( ${#UPDATE_MESSAGE} > 200 )); then
            echo '::error::The release note must be one line and no longer than 200 characters.'
            exit 1
          fi

          if [[ "$OTA_BINARY_EVIDENCE" =~ ^android=([^;]+)\;ios=([^;]+)\;runtime=([^;]+)\;source=([^;]+)$ ]]; then
            android_build_id="${BASH_REMATCH[1]}"
            ios_build_id="${BASH_REMATCH[2]}"
          else
            echo '::error::Unable to parse OTA binary evidence.'
            exit 1
          fi
          mkdir -p artifacts/eas-preview
          eas build:view "$android_build_id" --json > "${RUNNER_TEMP}/eas-preview-android-build.json"
          eas build:view "$ios_build_id" --json > "${RUNNER_TEMP}/eas-preview-ios-build.json"
          node utils/eas/verify-build-evidence.mjs \
            --android-json "${RUNNER_TEMP}/eas-preview-android-build.json" \
            --app-identifier com.cayan.sorita.socialmap \
            --evidence "$OTA_BINARY_EVIDENCE" \
            --ios-json "${RUNNER_TEMP}/eas-preview-ios-build.json" \
            --output artifacts/eas-preview/builds.json \
            --profile preview \
            --project-id "$EXPO_PUBLIC_EXPO_PROJECT_ID" \
            --runtime "$runtime_version" \
            --source "$BASE_SHA"

      - name: Classify the commit range
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          classification="$(node utils/guards/classify-ota-change.mjs --base "$BASE_SHA" --head "$TARGET_SHA")"
          if [[ "$classification" != 'OTA_SAFE' ]]; then
            node utils/guards/classify-ota-change.mjs --base "$BASE_SHA" --head "$TARGET_SHA" --explain
            echo "::error::Preview OTA blocked: ${classification}."
            exit 1
          fi
          echo "classification=${classification}" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run the complete release quality gate
        run: npm run check:release

      - name: Require a valid tracked OTA code-signing certificate
        shell: bash
        run: |
          set -euo pipefail
          npx expo config --json > "${RUNNER_TEMP}/expo-preview-config.json"
          node utils/eas/check-update-code-signing.mjs \
            --config "${RUNNER_TEMP}/expo-preview-config.json"

      - name: Publish to the isolated preview channel
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          eas update \
            --channel preview \
            --environment preview \
            --message "${UPDATE_MESSAGE} [sha:${TARGET_SHA}]" \
            --platform all \
            --json \
            --non-interactive \
            > "${RUNNER_TEMP}/eas-preview-update.json"

      - name: Record immutable preview evidence
        shell: bash
        env:
          RESULT_PATH: ${{ runner.temp }}/eas-preview-update.json
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFileSync, readFileSync, writeFileSync } = require('node:fs');
          const payload = JSON.parse(readFileSync(process.env.RESULT_PATH, 'utf8'));
          const updates = Array.isArray(payload) ? payload : payload.updates;
          if (!Array.isArray(updates) || updates.length === 0) {
            throw new Error('EAS returned no preview updates.');
          }
          const groups = [...new Set(updates.map((update) => update.group ?? update.groupId).filter(Boolean))];
          if (groups.length !== 1 || !/^[A-Za-z0-9-]{8,128}$/.test(groups[0])) {
            throw new Error('EAS returned an unexpected preview update group.');
          }
          const sanitizedUpdates = updates.map((update) => ({
            group: groups[0],
            id: update.id ?? update.updateId ?? null,
            platform: update.platform ?? null,
            runtimeVersion: update.runtimeVersion ?? null,
          }));
          writeFileSync(
            'artifacts/eas-preview/update.json',
            `${JSON.stringify({ commitSha: process.env.TARGET_SHA, group: groups[0], updates: sanitizedUpdates }, null, 2)}\n`,
          );
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              '## Preview OTA verified',
              '',
              `- Commit: \`${process.env.TARGET_SHA}\``,
              `- Update group: \`${groups[0]}\``,
              `- Preview workflow run ID for production approval: \`${process.env.GITHUB_RUN_ID}\``,
              '',
            ].join('\n'),
          );
          NODE

      - name: Upload sanitized preview build and update evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eas-preview-${{ github.sha }}
          path: artifacts/eas-preview
          if-no-files-found: error
          retention-days: 90

      - name: Remove transient update material
        if: always()
        shell: bash
        run: |
          rm -f -- "${RUNNER_TEMP}/eas-preview-update.json"
          rm -rf -- "${GITHUB_WORKSPACE}/dist" "${GITHUB_WORKSPACE}/.expo"
          printf 'EXPO_TOKEN=\n' >> "$GITHUB_ENV"
