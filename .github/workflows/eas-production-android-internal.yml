name: EAS Production Android Build and Play Internal
run-name: Production Android Play Internal delivery for ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Canonical full commit SHA on the default branch to build and submit
        required: true
        type: string
      quality_run_id:
        description: Successful Quality workflow run ID for candidate_sha
        required: true
        type: string
      database_run_id:
        description: Successful Database Validation workflow run ID for candidate_sha
        required: true
        type: string
      release_name:
        description: Single-line Play Internal release name (at most 50 characters)
        required: true
        type: string
      confirm_play_internal:
        description: Build with remote EAS credentials and submit this exact SHA to Play Internal
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: eas-production-android-internal
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Remote signed Android build and protected Play Internal submit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_RELEASE_ENVIRONMENT: production
      EXPO_PUBLIC_EXPO_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EXPO_PROJECT_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NODE_VERSION: '24'

    steps:
      - name: Check out the exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate immutable source, identity and explicit authorization
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONFIRM_PLAY_INTERNAL: ${{ inputs.confirm_play_internal }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_NAME: ${{ inputs.release_name }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::candidate_sha must be a canonical lower-case full commit SHA.'
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo '::error::Production Android delivery must be dispatched from the default branch.'
            exit 1
          fi
          if [[ "$CANDIDATE_SHA" != "$WORKFLOW_SHA" || "$(git rev-parse HEAD)" != "$CANDIDATE_SHA" ]]; then
            echo '::error::The dispatch, workflow and checked-out source must be the exact same SHA.'
            exit 1
          fi
          if [[ "$CONFIRM_PLAY_INTERNAL" != true ]]; then
            echo '::error::Explicit Play Internal confirmation is required.'
            exit 1
          fi
          if [[ -z "$EXPO_PUBLIC_EXPO_PROJECT_ID" || -z "$EXPO_PUBLIC_SUPABASE_URL" || -z "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo '::error::The protected production environment is missing required public build variables.'
            exit 1
          fi
          if [[ -z "$RELEASE_NAME" || "$RELEASE_NAME" == *$'\n'* || ${#RELEASE_NAME} -gt 50 ]]; then
            echo '::error::release_name must be one non-empty line of at most 50 characters.'
            exit 1
          fi
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Verify successful same-SHA Quality and Database Validation runs
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DATABASE_RUN_ID: ${{ inputs.database_run_id }}
          GH_TOKEN: ${{ github.token }}
          QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
        run: |
          set -euo pipefail

          verify_and_record() {
            local run_id="$1"
            local workflow_file="$2"
            local output_file="$3"
            if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
              echo "::error::${workflow_file} run ID must be numeric."
              exit 1
            fi
            local fields expected_id
            fields="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '[.status,.conclusion,.head_sha,(.workflow_id|tostring),.head_repository.full_name,.repository.full_name] | @tsv')"
            expected_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}" --jq '.id')"
            local status conclusion head_sha workflow_id head_repository repository
            IFS=$'\t' read -r status conclusion head_sha workflow_id head_repository repository <<< "$fields"
            if [[ "$status" != completed || "$conclusion" != success || "${head_sha,,}" != "${CANDIDATE_SHA,,}" || "$workflow_id" != "$expected_id" || "$head_repository" != "$GITHUB_REPOSITORY" || "$repository" != "$GITHUB_REPOSITORY" ]]; then
              echo "::error::${workflow_file} is not successful same-repository evidence for candidate_sha."
              exit 1
            fi
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              --jq '{id,workflow_id,head_sha,status,conclusion,event,head_repository:.head_repository.full_name,repository:.repository.full_name,html_url,created_at,updated_at}' \
              > "${RUNNER_TEMP}/${output_file}"
          }

          verify_and_record "$QUALITY_RUN_ID" quality.yml quality-run.json
          verify_and_record "$DATABASE_RUN_ID" database-validation.yml database-run.json

      - name: Install the immutable dependency tree
        run: npm ci --ignore-scripts

      - name: Validate credential portability policy
        run: npm run eas:credentials:check

      - name: Set up pinned EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0
        with:
          eas-version: 23.0.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build signed Android binary with frozen remote credentials
        shell: bash
        run: |
          set -euo pipefail
          raw_build="${RUNNER_TEMP}/eas-production-android-build.json"
          eas build \
            --platform android \
            --profile production \
            --freeze-credentials \
            --non-interactive \
            --wait \
            --json > "$raw_build"
          build_id="$(node --input-type=module - "$raw_build" <<'NODE'
          import { readFileSync } from 'node:fs';
          const raw = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const build = Array.isArray(raw) ? raw[0] : raw;
          if (!build || typeof build.id !== 'string' || !/^[0-9a-f-]{36}$/iu.test(build.id)) throw new Error('EAS Build did not return a valid build ID.');
          process.stdout.write(build.id);
          NODE
          )"
          printf 'BUILD_ID=%s\n' "$build_id" >> "$GITHUB_ENV"

      - name: Verify provider build identity and exact source SHA
        shell: bash
        env:
          APPLICATION_ID: com.cayan.sorita.socialmap
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          build_view="${RUNNER_TEMP}/eas-production-android-build-view.json"
          evidence="${RUNNER_TEMP}/eas-production-android-build-evidence.json"
          runtime_version="$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")"
          eas build:view "$BUILD_ID" --json > "$build_view"
          node utils/eas/verify-production-android-build.mjs \
            --build-json "$build_view" --build-id "$BUILD_ID" --package-id "$APPLICATION_ID" \
            --project-id "$EXPO_PUBLIC_EXPO_PROJECT_ID" --runtime "$runtime_version" \
            --source "$CANDIDATE_SHA" --output "$evidence"

      - name: Submit the verified build to Play Internal
        shell: bash
        run: |
          set -euo pipefail
          eas submit --platform android --profile production --id "$BUILD_ID" --non-interactive --wait

      - name: Create sanitized same-SHA delivery receipt
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const build = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/eas-production-android-build-evidence.json`, 'utf8'));
          const databaseValidationRun = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/database-run.json`, 'utf8'));
          const qualityRun = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/quality-run.json`, 'utf8'));
          writeFileSync(`${process.env.RUNNER_TEMP}/eas-production-android-play-internal-receipt.json`, `${JSON.stringify({ build, destination: 'play-internal', githubRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), githubRunId: Number(process.env.GITHUB_RUN_ID), prerequisiteRuns: { databaseValidation: databaseValidationRun, quality: qualityRun }, releaseName: process.env.RELEASE_NAME, schemaVersion: 1, sourceSha: process.env.CANDIDATE_SHA, status: 'submitted' }, null, 2)}\n`, { flag: 'wx' });
          NODE

      - name: Upload sanitized Android delivery evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eas-production-android-internal-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/eas-production-android-play-internal-receipt.json
          if-no-files-found: error
          retention-days: 90
