name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  NODE_OPTIONS: --max-old-space-size=6144
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  database-security:
    name: Database Migration & RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start isolated Supabase stack
        run: supabase start

      - name: Reset and replay every migration
        run: supabase db reset --local

      - name: Lint database schema
        run: supabase db lint --local --level error

      - name: Run pgTAP RLS and IDOR matrix
        run: supabase test db

      - name: Backup and restore the local database into an isolated database
        run: |
          DB_CONTAINER="supabase_db_SoRita"
          docker inspect "$DB_CONTAINER" >/dev/null
          docker exec "$DB_CONTAINER" pg_dump --username supabase_admin --format custom --no-owner --no-privileges --file /tmp/sorita.backup postgres
          docker exec "$DB_CONTAINER" createdb --username supabase_admin sorita_restore_drill
          docker exec "$DB_CONTAINER" pg_restore --username supabase_admin --dbname sorita_restore_drill --exit-on-error --no-owner --no-privileges /tmp/sorita.backup
          docker exec "$DB_CONTAINER" psql --username supabase_admin --dbname sorita_restore_drill --set ON_ERROR_STOP=1 --command "select count(*) from pg_catalog.pg_tables where schemaname = 'public';"
          docker exec "$DB_CONTAINER" dropdb --username supabase_admin sorita_restore_drill

  security-supply-chain:
    name: Security & Supply Chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Production dependency audit
        run: npm run security:audit:prod

      - name: Registry signature and provenance verification
        run: npm run security:provenance

      - name: Production license policy
        run: npm run security:licenses

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Expo dependency and project health check
        run: npm run expo:check

      - name: ESLint and architecture boundary check
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Dead code and dependency boundary check
        run: npm run dead-code:check

      - name: Critical user-flow evidence manifest
        run: npm run e2e:evidence

      - name: Startup and perceived-performance budgets
        run: npm run performance:test

      - name: Android JavaScript bundle-size budget
        run: npm run bundle:android:check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [database-security, lint-and-typecheck, security-supply-chain]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run app-shell and data tests
        run: npx vitest run src/mobile/app/app-shell src/mobile/app/data --reporter=verbose

      - name: Run feature tests (auth/discovery/explore/home/lists)
        run: npx vitest run src/mobile/app/features/auth src/mobile/app/features/explore src/mobile/app/features/home src/mobile/app/features/lists --reporter=verbose

      - name: Run feature tests (map)
        run: npx vitest run src/mobile/app/features/map --reporter=verbose

      - name: Run feature tests (notifications/places)
        run: npx vitest run src/mobile/app/features/notifications src/mobile/app/features/places --reporter=verbose

      - name: Run feature tests (profile/settings)
        run: npx vitest run src/mobile/app/features/profile src/mobile/app/features/settings --reporter=verbose

      - name: Run feature tests (social)
        run: npx vitest run src/mobile/app/features/social --reporter=verbose

      - name: Run platform and shared tests
        run: npx vitest run src/mobile/app/platform src/mobile/app/shared src/shared --reporter=verbose

      - name: Run Supabase function tests
        run: npx vitest run supabase/functions --reporter=verbose

      - name: Security tests
        run: npm run security:verify

      - name: Coverage threshold
        run: npm run test:coverage

  build-android:
    name: EAS Build (Android Preview)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_EAS_PREVIEW_BUILDS == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build Android preview
        run: eas build --platform android --profile preview --non-interactive

  android-device-performance:
    name: Low-end Android Performance & Baseline Profile
    runs-on: [self-hosted, android-low-end]
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_ANDROID_DEVICE_BENCHMARKS == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate Baseline and Startup Profiles from critical journeys
        run: npm run android:profile:generate

      - name: Measure cold start, navigation, scrolling and frame timing
        run: npm run android:performance:test

      - name: Upload benchmark reports and generated profiles
        uses: actions/upload-artifact@v7
        with:
          name: android-device-performance
          path: |
            android/app/src/release/generated/baselineProfiles
            android/baselineprofile/build/outputs

  build-ios:
    name: EAS Build (iOS Preview)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_EAS_PREVIEW_BUILDS == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build iOS preview
        run: eas build --platform ios --profile preview --non-interactive
