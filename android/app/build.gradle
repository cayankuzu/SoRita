/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

apply from: new File(["node", "--print", "require('path').dirname(require.resolve('@sentry/react-native/package.json'))"].execute().text.trim(), "sentry.gradle")

def runProjectCommand = { List<String> command ->
    def stdout = new StringBuffer()
    def stderr = new StringBuffer()
    def process = command.execute(null, file(projectRoot))

    process.consumeProcessOutput(stdout, stderr)

    if (process.waitFor() != 0) {
        throw new GradleException(
            "Command failed (${command.join(' ')}).\n" +
            "stdout:\n${stdout}\n" +
            "stderr:\n${stderr}"
        )
    }

    return stdout.toString()
}

def exportWindowsTrackedResources = tasks.register("exportWindowsTrackedResources") {
    onlyIf { isWindowsHost }

    doLast {
        delete windowsResourceExportRoot
        windowsResourceExportRoot.mkdirs()

        runProjectCommand(["git", "ls-files", "android/app/src/main/res"])
            .readLines()
            .findAll { !it.isBlank() }
            .each { trackedFile ->
                runProjectCommand([
                    "git",
                    "checkout-index",
                    "-f",
                    "--prefix=${windowsResourceExportRoot.absolutePath.replace('\\', '/')}/",
                    "--",
                    trackedFile,
                ])
            }
    }
}

tasks.matching { task -> task.name == "preBuild" }.configureEach {
    dependsOn(exportWindowsTrackedResources)
}

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.cayan.sorita.socialmap'
    sourceSets {
        main {
            if (isWindowsHost) {
                res.srcDirs = [windowsResourceMirrorDir]
            }
        }
    }
    defaultConfig {
        applicationId 'com.cayan.sorita.socialmap'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 92
        versionName "1.0.87"
        manifestPlaceholders = [
            googleMapsApiKey: resolveGoogleMapsApiKey()
        ]

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (resolveReleaseStoreFile() != null) {
                storeFile resolveReleaseStoreFile()
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (resolveReleaseStoreFile() == null || !resolveReleaseStoreFile().exists()) {
                throw new GradleException("Release signing config is missing. Create android/keystore.properties before building release.")
            }

            signingConfig signingConfigs.release
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

def verifyReleaseSigningKey = tasks.register("verifyReleaseSigningKey") {
    doLast {
        if (!releaseExpectedSha1) {
            println("No expected release signing SHA1 configured; skipping signing fingerprint verification.")
            return
        }

        def actualSha1 = resolveReleaseCertificateSha1()

        if (!actualSha1) {
            throw new GradleException("Release keystore fingerprint could not be resolved. Check the configured keystore path and alias.")
        }

        if (actualSha1 != releaseExpectedSha1) {
            throw new GradleException(
                "Release keystore fingerprint mismatch. Expected ${releaseExpectedSha1} but found ${actualSha1}. " +
                "Point the build to the original Play upload keystore before creating a release bundle."
            )
        }

        println("Release signing fingerprint verified: ${actualSha1}")
    }
}

tasks.register("printReleaseSigningFingerprint") {
    doLast {
        println("Expected upload SHA1: ${releaseExpectedSha1 ?: 'not configured'}")
        println("Configured release SHA1: ${resolveReleaseCertificateSha1() ?: 'unavailable'}")
        println("Configured release keystore: ${resolveReleaseStoreFile() ?: 'unavailable'}")
    }
}

tasks.matching { task ->
    task.name in [
        "assembleRelease",
        "bundleRelease",
        "packageReleaseBundle",
        "signReleaseBundle",
    ]
}.configureEach {
    dependsOn(verifyReleaseSigningKey)
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

afterEvaluate {
    def codegenJniStubs = [
        [
            path  : "../node_modules/@react-native-async-storage/async-storage/android/build/generated/source/codegen/jni",
            target: "react_codegen_rnasyncstorage",
        ],
        [
            path  : "../node_modules/react-native-gesture-handler/android/build/generated/source/codegen/jni",
            target: "react_codegen_rngesturehandler_codegen",
        ],
        [
            path  : "../node_modules/react-native-webview/android/build/generated/source/codegen/jni",
            target: "react_codegen_RNCWebViewSpec",
        ],
    ]
    def codegenJniPaths = [
        "../node_modules/@react-native-async-storage/async-storage/android/build/generated/source/codegen/jni",
        "../node_modules/react-native-gesture-handler/android/build/generated/source/codegen/jni",
        "../node_modules/react-native-webview/android/build/generated/source/codegen/jni",
        "../node_modules/@sentry/react-native/android/build/generated/source/codegen/jni",
    ]
    def moduleCleanTaskPaths = [
        ":react-native-async-storage_async-storage:clean",
        ":react-native-gesture-handler:clean",
        ":react-native-webview:clean",
    ]
    def ensureCodegenJniStubs = tasks.register("ensureCodegenJniStubs") {
        doLast {
            codegenJniStubs.each { stub ->
                def jniDir = file(stub.path)

                if (jniDir.exists()) {
                    return
                }

                jniDir.mkdirs()
                def cppFile = new File(jniDir, "stub.cpp")
                cppFile.text = "void ${stub.target}_stub() {}\n"

                def cmakeFile = new File(jniDir, "CMakeLists.txt")
                cmakeFile.text = """cmake_minimum_required(VERSION 3.13)
add_library(${stub.target} SHARED stub.cpp)
"""
            }
        }
    }

    tasks.matching { task ->
        task.name.startsWith("configureCMake") || task.name.startsWith("externalNativeBuild")
    }.configureEach {
        dependsOn(ensureCodegenJniStubs)
    }

    [
        "externalNativeBuildCleanDebug",
        "externalNativeBuildCleanDebugOptimized",
        "externalNativeBuildCleanRelease",
    ].each { cleanTaskName ->
        def externalNativeBuildCleanTask = tasks.findByName(cleanTaskName)

        if (externalNativeBuildCleanTask == null) {
            return
        }

        moduleCleanTaskPaths.each { taskPath ->
            def moduleCleanTask = tasks.findByPath(taskPath)
            if (moduleCleanTask != null) {
                moduleCleanTask.mustRunAfter(externalNativeBuildCleanTask)
            }
        }

        externalNativeBuildCleanTask.onlyIf {
            codegenJniPaths.every { relativePath ->
                file(relativePath).exists()
            }
        }
    }
}
