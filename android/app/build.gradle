apply plugin: "com.android.application"
apply plugin: "com.google.gms.google-services"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

import java.io.FileInputStream
import java.security.KeyStore
import java.security.MessageDigest
import java.util.Locale
import java.util.Properties

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
def localEnvProperties = new Properties()

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

[
    ".env",
    ".env.local",
].each { envFileName ->
    def envFile = new File(projectRoot, envFileName)

    if (envFile.exists()) {
        envFile.withInputStream { stream ->
            localEnvProperties.load(stream)
        }
    }
}

def normalizeSha1 = { value ->
    value == null ? null : value.toString().trim().toUpperCase(Locale.ROOT)
}

def isWindowsHost = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")
def windowsResourceExportRoot = file("C:/t/sorita-android-res-export")
def windowsResourceMirrorDir = new File(windowsResourceExportRoot, "android/app/src/main/res")

def releaseStoreFilePath =
    (findProperty('soritaReleaseStoreFile') ?: System.getenv('SORITA_RELEASE_STORE_FILE') ?: keystoreProperties['storeFile'])?.toString()
def releaseStorePassword =
    (findProperty('soritaReleaseStorePassword') ?: System.getenv('SORITA_RELEASE_STORE_PASSWORD') ?: keystoreProperties['storePassword'])?.toString()
def releaseKeyAlias =
    (findProperty('soritaReleaseKeyAlias') ?: System.getenv('SORITA_RELEASE_KEY_ALIAS') ?: keystoreProperties['keyAlias'])?.toString()
def releaseKeyPassword =
    (findProperty('soritaReleaseKeyPassword') ?: System.getenv('SORITA_RELEASE_KEY_PASSWORD') ?: keystoreProperties['keyPassword'])?.toString()
def releaseExpectedSha1 =
    normalizeSha1(findProperty('soritaReleaseExpectedSha1') ?: System.getenv('SORITA_RELEASE_EXPECTED_SHA1'))

def resolveReleaseStoreFile = {
    releaseStoreFilePath ? rootProject.file(releaseStoreFilePath) : null
}

def resolveGoogleMapsApiKey = {
    (
        findProperty('EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_API_KEY') ?:
        System.getenv('EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_API_KEY') ?:
        findProperty('GOOGLE_MAPS_ANDROID_API_KEY') ?:
        System.getenv('GOOGLE_MAPS_ANDROID_API_KEY') ?:
        localEnvProperties.getProperty('EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_API_KEY') ?:
        localEnvProperties.getProperty('GOOGLE_MAPS_ANDROID_API_KEY') ?:
        findProperty('EXPO_PUBLIC_GOOGLE_MAPS_API_KEY') ?:
        System.getenv('EXPO_PUBLIC_GOOGLE_MAPS_API_KEY') ?:
        findProperty('GOOGLE_MAPS_API_KEY') ?:
        System.getenv('GOOGLE_MAPS_API_KEY') ?:
        localEnvProperties.getProperty('EXPO_PUBLIC_GOOGLE_MAPS_API_KEY') ?:
        localEnvProperties.getProperty('GOOGLE_MAPS_API_KEY') ?:
        ''
    ).toString().trim()
}

def formatSha1 = { byte[] bytes ->
    bytes.collect { byte value -> String.format('%02X', value & 0xFF) }.join(':')
}

def resolveReleaseCertificateSha1 = {
    def keyStoreFile = resolveReleaseStoreFile()

    if (keyStoreFile == null || !keyStoreFile.exists() || !releaseStorePassword || !releaseKeyAlias) {
        return null
    }

    def keyStoreType = keyStoreFile.name.toLowerCase(Locale.ROOT).endsWith('.jks') ? 'JKS' : KeyStore.getDefaultType()
    def keyStore = KeyStore.getInstance(keyStoreType)

    keyStoreFile.withInputStream { stream ->
        keyStore.load(stream, releaseStorePassword.toCharArray())
    }

    def certificate = keyStore.getCertificate(releaseKeyAlias)

    if (certificate == null) {
        return null
    }

    return formatSha1(MessageDigest.getInstance('SHA-1').digest(certificate.getEncoded()))
}

